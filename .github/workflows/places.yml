name: Build place data
# Downloads GeoNames (CC BY 4.0) and commits app/src/main/assets/places.tsv. Run manually when the data should be refreshed.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: mkdir -p app/src/main/assets && python tools/places/build_places.py app/src/main/assets/places.tsv
      - run: |
          head -5 app/src/main/assets/places.tsv
          grep -P "^Bengaluru\t" app/src/main/assets/places.tsv | head -2
          ls -la app/src/main/assets/places.tsv
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/places.tsv
          git diff --cached --quiet && echo "No change" || (git commit -m "Place data from GeoNames (CC BY 4.0)" && git pull --rebase origin main && git push origin HEAD:main)
