name: Model bake-off
# Run manually from the Actions tab after adding GEMINI_API_KEY as a repository secret.
# Add ANTHROPIC_API_KEY too and include claude-haiku-5-5 in the models input to compare.
on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated models
        default: gemini-2.5-flash-lite
permissions:
  contents: write
jobs:
  bakeoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node eval/run.mjs --models "${{ inputs.models }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: cat eval/results/*/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: bakeoff-results, path: eval/results }
      - name: Save results to the bakeoff-results branch (synthetic data only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/res && cp -r eval/results/* /tmp/res/
          git fetch origin bakeoff-results || true
          if git rev-parse --verify origin/bakeoff-results >/dev/null 2>&1; then git checkout -B bakeoff-results origin/bakeoff-results; else git checkout --orphan bakeoff-results && git rm -rf . -q; fi
          mkdir -p runs && cp -r /tmp/res/* runs/
          git add runs && git commit -m "Bake-off results ${{ github.run_id }}" && git push origin bakeoff-results
