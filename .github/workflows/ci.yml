name: Build, test & release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Core tests + app unit tests + APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Core calculations (golden fixtures) and app unit tests
        run: |
          ./gradlew --no-daemon --console=plain :core:test testDebugUnitTest > unit.log 2>&1 || (grep -E "^e: |error:|What went wrong|FAILED|FAIL |Unresolved|Caused by" unit.log | head -60 | sed 's/^/::error title=build::/' ; exit 1)
          grep -E "PASSED [0-9]+|note:" unit.log | sed 's/^/::notice title=core::/' || true
      - name: Build release APK
        run: |
          ./gradlew --no-daemon --console=plain assembleRelease > apk.log 2>&1 || (grep -E "^e: |error:|What went wrong|Unresolved|Caused by" apk.log | head -60 | sed 's/^/::error title=apk::/' ; exit 1)
      - name: Build the Play Store bundle (AAB, for the Play Console testing track)
        run: |
          ./gradlew --no-daemon --console=plain bundleRelease > aab.log 2>&1 || (grep -E "^e: |error:|What went wrong|Caused by" aab.log | head -40 | sed 's/^/::error title=aab::/' ; exit 1)
      - name: Name the APK and AAB
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/ASTRA-v${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/ASTRA-v${VERSION}.aab"
      - name: Check the APK is signed with the ASTRA key
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs out/*.apk | tee sig.txt
          grep -qi "f41af32c519645f8609627ac592418d0e3fc5a07" <(tr -d ':' < sig.txt | tr 'A-Z' 'a-z') || (echo "::error title=signing::APK is not signed with the ASTRA key"; exit 1)
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: "out/*" }
      - name: Model bake-off harness dry run
        run: node eval/run.mjs --mock

  ui-tests:
    name: Emulator smoke tests (phone)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke tests on emulator
        id: smoke1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true > connected.log 2>&1; R=$?; adb pull /sdcard/Android/data/app.astra/files/shots shots || true; if [ $R -ne 0 ]; then grep -E "FAILED|Exception|INSTALL_|error:|What went wrong|Caused by|Timed out" connected.log | head -40 | sed 's/^/::error title=connected::/'; exit 1; fi
      - name: Run smoke tests on emulator (retry once if the emulator flaked)
        if: steps.smoke1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true > connected.log 2>&1; R=$?; adb pull /sdcard/Android/data/app.astra/files/shots shots || true; if [ $R -ne 0 ]; then grep -E "FAILED|Exception|INSTALL_|error:|What went wrong|Caused by|Timed out" connected.log | head -40 | sed 's/^/::error title=connected::/'; exit 1; fi
      - name: Report failed tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fl.text or fl.get('message') or '').strip().replace('\n', ' | ')[:1800]
                      print(f"::error title={tc.get('name')}::{msg}")
          PY
      - name: Push screenshots to the shots-phone branch (synthetic test data only)
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q && git checkout -q -b shots-phone
          git add . && git -c user.name=ci -c user.email=ci@example.com commit -qm "screenshots ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots-phone

  ui-tests-tablet:
    name: Emulator screenshots (tablet, landscape)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke tests on emulator
        id: smoke1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_c
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.astra.SmokeTest#a_fullJourneyKnownTime,app.astra.SmokeTest#i_tarotReadingAndCrossReading,app.astra.SmokeTest#k_dailyCardAndPrivacy,app.astra.SmokeTest#l_oracleDecks -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true > connected.log 2>&1; R=$?; adb pull /sdcard/Android/data/app.astra/files/shots shots || true; if [ $R -ne 0 ]; then grep -E "FAILED|Exception|INSTALL_|error:|What went wrong|Caused by|Timed out" connected.log | head -40 | sed 's/^/::error title=connected::/'; exit 1; fi
      - name: Run smoke tests on emulator (retry once if the emulator flaked)
        if: steps.smoke1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_c
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.astra.SmokeTest#a_fullJourneyKnownTime,app.astra.SmokeTest#i_tarotReadingAndCrossReading,app.astra.SmokeTest#k_dailyCardAndPrivacy,app.astra.SmokeTest#l_oracleDecks -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true > connected.log 2>&1; R=$?; adb pull /sdcard/Android/data/app.astra/files/shots shots || true; if [ $R -ne 0 ]; then grep -E "FAILED|Exception|INSTALL_|error:|What went wrong|Caused by|Timed out" connected.log | head -40 | sed 's/^/::error title=connected::/'; exit 1; fi
      - name: Report failed tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fl.text or fl.get('message') or '').strip().replace('\n', ' | ')[:1800]
                      print(f"::error title={tc.get('name')}::{msg}")
          PY
      - name: Push screenshots to the shots-tablet branch (synthetic test data only)
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q && git checkout -q -b shots-tablet
          git add . && git -c user.name=ci -c user.email=ci@example.com commit -qm "screenshots ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots-tablet

  release:
    name: Publish APK
    needs: [build, ui-tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk, path: out }
      - run: |
          echo "APK=$(ls out/*.apk)" >> $GITHUB_ENV
          echo "AAB=$(ls out/*.aab)" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ASTRA — build ${{ github.run_number }}
          body: |
            Passed: core calculation tests (golden fixtures) and emulator smoke tests.
            Install: open this page on your Android phone, tap the .apk below, and allow "Install unknown apps" for your browser if asked.
            Installs over the previous build and keeps your details.
            The .aab file is for uploading to the Play Console testing track (see docs/PLAY-CONSOLE.md); phones can't install it directly.
          files: |
            ${{ env.APK }}
            ${{ env.AAB }}
          make_latest: true
