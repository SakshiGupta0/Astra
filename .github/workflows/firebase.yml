name: Firebase (AI server + database rules)
# Tests on every push. Deploys to Firebase from main once the project exists (.firebaserc) and the
# FIREBASE_SERVICE_ACCOUNT secret is set (see docs/FIREBASE-SETUP.md).
on:
  push:
    branches: [main]
    paths: ["functions/**", "firestore.rules", "firebase.json", ".firebaserc", ".github/workflows/firebase.yml"]
  pull_request:
    paths: ["functions/**", "firestore.rules"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Gateway unit tests + security rules tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Gateway unit tests
        run: cd functions && node --test test/*.test.js
      - name: Firestore rules tests (emulator)
        run: |
          cd functions/rules-test && npm install --no-audit --no-fund --silent
          npx --yes firebase-tools@14 emulators:exec --only firestore --project astra-rules-test "npm test"

  deploy:
    name: Deploy to Firebase
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check setup
        id: ready
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ] || [ ! -f .firebaserc ]; then
            echo "::notice title=deploy skipped::Firebase isn't set up yet (needs .firebaserc and the FIREBASE_SERVICE_ACCOUNT secret)."
            echo "ok=false" >> $GITHUB_OUTPUT
          else
            echo "ok=true" >> $GITHUB_OUTPUT
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v5
        with: { node-version: '22' }
      - if: steps.ready.outputs.ok == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Install function dependencies
        if: steps.ready.outputs.ok == 'true'
        run: cd functions && npm install --omit=dev --no-audit --no-fund --silent
      - name: Store the Gemini key as a Firebase secret
        if: steps.ready.outputs.ok == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          umask 077; printf '%s' "$GEMINI_API_KEY" > /tmp/gk
          npx --yes firebase-tools@14 functions:secrets:set GEMINI_API_KEY --data-file /tmp/gk --force --non-interactive
          rm -f /tmp/gk
      - name: Deploy functions and rules
        if: steps.ready.outputs.ok == 'true'
        run: npx --yes firebase-tools@14 deploy --only functions,firestore:rules --force --non-interactive
